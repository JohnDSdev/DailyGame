<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2efe6">
  <title>Daily Game</title>
  <meta name="description" content="One new browser game and one new article every day.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="masthead shell">
    <div class="masthead-top">
      <span>ONE NEW GAME / ONE NEW ARTICLE / EVERY DAY</span>
      <strong id="dayCount">DAY 001</strong>
    </div>
    <a class="wordmark" href="./" aria-label="Daily Game home">DAILY GAME</a>
  </header>

  <main class="shell">
    <section class="today" aria-labelledby="today-title">
      <div class="section-kicker">
        <span>TODAY'S ISSUE</span>
        <time id="latestDate"></time>
      </div>

      <div class="today-grid">
        <div class="today-copy">
          <p id="latestType" class="game-type">GAME</p>
          <h1 id="today-title">Daily Game</h1>
          <p id="latestDescription" class="dek"></p>
          <div class="play-line">
            <a id="latestGame" class="play-button" href="#">PLAY TODAY'S GAME <span aria-hidden="true">↗</span></a>
          </div>
        </div>

        <a id="latestPoster" class="poster" href="#" aria-label="Play today's game">
          <img id="latestPreview" src="" alt="">
        </a>
      </div>

      <div class="article-feature">
        <span class="article-label">TODAY'S READING</span>
        <a id="latestArticle" href="#">
          <strong id="latestArticleTitle"></strong>
          <span id="latestArticleDescription"></span>
        </a>
        <span class="article-arrow" aria-hidden="true">→</span>
      </div>
    </section>

    <section class="archive" aria-labelledby="archive-title">
      <div class="archive-heading">
        <h2 id="archive-title">Archive</h2>
      </div>
      <div class="archive-labels" aria-hidden="true">
        <span>GAME</span><span>TYPE</span><span>READ</span><span></span>
      </div>
      <div id="archiveRows" class="archive-rows"></div>
    </section>
  </main>

  <script src="data/days.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
